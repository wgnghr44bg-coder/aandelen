name: Data-audit

# Controleert ieder rente-, inflatie- en woningprijscijfer op de site tegen de originele bron
# (ECB/DNB, Eurostat, CBS) en zet het resultaat in audit/rapport.md.
on:
  schedule:
    - cron: "13 5 * * *"   # elke dag 05:13 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Live-data ophalen
        run: |
          git fetch -q origin live || true
          if git show origin/live:data.json > "$RUNNER_TEMP/data.json" 2>/dev/null; then mv "$RUNNER_TEMP/data.json" docs/data.json; fi
      - name: Controleer de cijfers tegen de bronnen
        run: python -u audit.py
      - name: Rapport bewaren
        run: |
          git add audit/rapport.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data-audit $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
