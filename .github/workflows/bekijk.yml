name: Site bekijken (tijdelijk)
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL"
        required: true
permissions:
  contents: write
jobs:
  bekijk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python -u tools/bekijk_site.py "${{ inputs.url }}"
      - name: Schermafdrukken bewaren (tijdelijke branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b tmp-bekijk
          git add -f tmp_bekijk
          git commit -m "tijdelijke schermafdrukken" && git push -f origin tmp-bekijk
