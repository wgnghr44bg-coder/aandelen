name: Koersen bijwerken

on:
  schedule:
    - cron: "45 22 * * 1-5"   # elke werkdag 22:45 UTC, na sluiting van de Amerikaanse beurs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  # Een nieuwe update breekt een oude (of vastgelopen) update af, zodat er nooit iets blijft wachten.
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installeer pakketten
        run: pip install -r requirements.txt

      - name: Haal koersen op
        run: python update.py

      - name: Commit data als die veranderd is
        run: |
          git add docs/data.json
          if [ -f docs/history.json ]; then git add docs/history.json; fi
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Koersen bijgewerkt $(date -u +%Y-%m-%d)"
          git push
