name: Verkenning vastgoedfinanciers (tijdelijk)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verken:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python -u tools/verken_browser.py
