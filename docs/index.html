<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StockHunter</title>
<meta name="description" content="StockHunter: de 100 grootste beursgenoteerde bedrijven, gesorteerd op koersdaling of -stijging.">
<meta name="apple-mobile-web-app-title" content="StockHunter">
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--text:#16181d;--muted:#6b7280;--line:#e5e7eb;
  --accent:#2563eb;--down:#d9480f;--down-strong:#c92a2a;--up:#2b8a3e;--chip:#eef0f3;
  --warn-bg:#fff4e6;--warn-text:#9a3412;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--card:#181b21;--text:#e8eaed;--muted:#9aa1ac;--line:#2a2f37;
  --accent:#6ea8fe;--down:#ff8a4c;--down-strong:#ff6b6b;--up:#51cf66;--chip:#232831;
  --warn-bg:#3a2414;--warn-text:#ffc078;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{padding:20px 0 8px}
h1{font-size:1.6rem;letter-spacing:-.01em;line-height:1.2;margin:0 0 4px}
.sub{color:var(--muted);font-size:.85rem;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;font:inherit;color:inherit;cursor:pointer;min-width:0}
.stat[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.stat b{display:block;font-size:1.1rem;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{color:var(--muted);font-size:.75rem;line-height:1.2;display:block}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.periods{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.periods::-webkit-scrollbar{display:none}
.periods button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 13px;font:inherit;font-size:.85rem;cursor:pointer}
.periods button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.filters{display:flex;gap:8px;margin-top:8px}
.filters select,.filters input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 10px;font:inherit;font-size:16px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--chip);border-radius:10px;padding:3px;margin-bottom:8px}
.mode button{border:0;background:none;color:var(--muted);border-radius:8px;padding:7px 0;font:inherit;font-size:.88rem;font-weight:600;cursor:pointer}
.mode button[aria-pressed=true]{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-style:normal;color:var(--text);margin-top:2px}
.chart{margin:0 0 12px}
.chart-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-height:38px}
.chart-read{font-size:.8rem;color:var(--muted);line-height:1.25}
.chart-read b{display:block;color:var(--text);font-size:.95rem;font-variant-numeric:tabular-nums}
.ranges{display:flex;gap:2px;background:var(--chip);border-radius:8px;padding:2px;flex:0 0 auto}
.ranges button{border:0;background:none;color:var(--muted);font:inherit;font-size:.78rem;font-weight:600;padding:5px 9px;border-radius:6px;cursor:pointer}
.ranges button[aria-pressed=true]{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.plot{position:relative;touch-action:pan-y;margin-top:6px}
.plot svg{display:block;width:100%;height:170px;overflow:visible}
.plot .grid-l{stroke:var(--line);stroke-width:1}
.plot .ax{fill:var(--muted);font-size:10px;font-family:inherit}
.plot .hi{fill:var(--card);stroke-width:2}
.plot .hl{fill:var(--muted);font-size:10px;font-family:inherit}
.plot .cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart-msg{color:var(--muted);font-size:.8rem;padding:20px 0;text-align:center}
.extras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 0}
.xt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;text-align:left;font:inherit;color:inherit;cursor:pointer;min-width:0}
.xt[aria-expanded=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.xt .xl{display:block;font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xt .xl b{color:var(--text);font-size:.85rem;display:block}
.xt .xp{display:block;font-weight:700;font-variant-numeric:tabular-nums;font-size:1rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xt .xc{display:block;white-space:nowrap;font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums}
.xpanel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
.xpanel h3{margin:0 0 6px;font-size:.92rem}
.xpanel .grid{margin-top:4px}
.live{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--up);margin-left:4px;vertical-align:middle}
.heat-h{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px}
.heat-h h2{font-size:1rem;margin:0}
.heat-h span{color:var(--muted);font-size:.75rem}
.heat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ht{border:1px solid var(--line);border-radius:10px;padding:8px 9px;text-align:left;font:inherit;color:var(--text);cursor:pointer;min-width:0;min-height:64px}
.ht[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:1px}
.ht .hn{display:block;font-size:.74rem;font-weight:600;line-height:1.2;hyphens:auto;overflow-wrap:anywhere}
.ht .hv{display:block;font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.ht .hc{display:block;font-size:.68rem;opacity:.75}
.ht.ai{border-width:2px}
.heat-key{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.7rem;margin-top:6px}
.heat-key i{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,color-mix(in oklab,var(--down-strong) 60%,var(--card)),var(--card),color-mix(in oklab,var(--up) 60%,var(--card)));border:1px solid var(--line)}
.aitag{display:inline-block;font-size:.68rem;font-weight:700;padding:0 5px;border-radius:4px;background:var(--chip);color:var(--text);margin-left:2px}
.grp{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:8px 8px 8px 12px;margin:12px 0 4px}
.grp .gt{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .gt span{display:block;font-weight:500;font-size:.75rem;color:var(--muted)}
.grp .seg{display:flex;gap:2px;background:var(--chip);border-radius:8px;padding:2px}
.grp .seg button,.grp .x{border:0;background:none;color:var(--muted);font:inherit;font-size:.8rem;font-weight:600;padding:6px 8px;border-radius:6px;cursor:pointer}
.grp .seg button[aria-pressed=true]{background:var(--bg);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.grp .x{font-size:1.1rem;padding:4px 8px}
.updrow{display:flex;flex-wrap:nowrap;align-items:center;gap:6px 8px;margin-top:4px}
.updrow .upd{margin:0 auto 0 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#refresh{width:34px;height:32px;justify-content:center;padding:0;flex:0 0 auto}
.updrow a.rbtn{flex:0 0 auto;height:32px}
.rbtn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:5px 11px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;text-decoration:none}
.rbtn .ri{display:inline-block;font-size:1rem;line-height:1}
.rbtn.busy .ri{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.upd{color:var(--muted);font-size:.8rem;margin:2px 0 0}
.upd b{color:var(--text);font-weight:600}
.count{color:var(--muted);font-size:.8rem;margin:10px 0 6px}
ul{list-style:none;margin:0;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer;width:100%;border:0;background:none;color:inherit;font:inherit;text-align:left}
.pos{width:24px;flex:0 0 24px;color:var(--muted);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
.main{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--muted);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk{font-weight:600;color:var(--text);opacity:.8}
.val{text-align:right;flex:0 0 auto;width:84px}
.pct{font-weight:700;font-variant-numeric:tabular-nums;font-size:1.02rem}
.down{color:var(--down)}.down2{color:var(--down-strong)}.up{color:var(--up)}.flat{color:var(--muted)}
.track{height:4px;background:var(--chip);border-radius:2px;margin-top:5px;overflow:hidden}
.fill{height:100%;border-radius:2px;margin-left:auto}
.detail{display:none;border-top:1px solid var(--line);padding:12px;font-size:.88rem}
.card.open .detail{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.grid div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0}
.grid dt{color:var(--muted)}.grid dd{margin:0;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.warn{background:var(--warn-bg);color:var(--warn-text);border-radius:8px;padding:7px 10px;margin-top:8px;font-size:.82rem}
.ext{display:inline-block;margin-top:10px;color:var(--accent);font-size:.82rem}
.info{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 16px;margin:20px 0;font-size:.88rem}
.info h2{font-size:1rem;margin:12px 0 4px}
.info p{margin:0 0 10px;color:var(--muted)}
footer{color:var(--muted);font-size:.75rem;text-align:center;padding:0 0 28px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">StockHunter</h1>
    <div class="updrow">
      <p class="upd" id="upd">Laden…</p>
      <button type="button" class="rbtn" id="refresh" aria-label="Vernieuwen"><span class="ri">↻</span></button>
      <a class="rbtn" href="https://github.com/wgnghr44bg-coder/aandelen/actions/workflows/update.yml" target="_blank" rel="noopener" aria-label="Nieuwe update starten op GitHub">▶ Update</a>
    </div>
    <div class="extras" id="extras" hidden></div>
    <div id="xpanel"></div>
    <div class="stats">
      <button type="button" class="stat" data-st="s1" aria-pressed="false"><b id="sDown">–</b><span id="sDownL">gedaald</span></button>
      <button type="button" class="stat" data-st="s2" aria-pressed="false"><b id="s20">–</b><span id="s20L">20%+ gezakt</span></button>
      <button type="button" class="stat" data-st="top"><b id="sTop">–</b><span><span id="sTopT">grootste daler</span><i id="sTopL" class="clamp">–</i></span></button>
    </div>
  </header>
</div>
<div class="bar">
  <div class="wrap">
    <div class="mode" id="mode" role="group" aria-label="Weergave">
      <button type="button" data-m="down" aria-pressed="true">📉 Dalers</button>
      <button type="button" data-m="up" aria-pressed="false">📈 Stijgers</button>
    </div>
    <div class="periods" id="periods" role="group" aria-label="Periode"></div>
    <div class="filters">
      <select id="sector" aria-label="Sector"><option value="">Alle sectoren</option></select>
      <input id="q" type="search" placeholder="Naam of ticker" aria-label="Zoeken" autocomplete="off">
    </div>
  </div>
</div>
<div class="wrap">
  <section id="heatwrap" hidden>
    <div class="heat-h"><h2>Hoe gaan de sectoren?</h2></div>
    <div class="heat" id="heat"></div>
    <div class="heat-key"><span>−</span><i></i><span>+</span></div>
  </section>
  <div class="grp" id="grp" hidden></div>
  <p class="count" id="count"></p>
  <ul id="list"></ul>
  <footer id="foot"></footer>
</div>
<script>
(function(){
  var PERIODS=[
    {k:"fromHigh",l:"Onder jaartop"},
    {k:"m1",l:"1 maand"},
    {k:"m3",l:"3 maanden"},
    {k:"ytd",l:"Sinds 1 jan"},
    {k:"y1",l:"1 jaar"}
  ];
  var SECTORS={
    "Technology":"Technologie","Healthcare":"Gezondheidszorg","Financial Services":"Financiële diensten",
    "Consumer Cyclical":"Cyclische consumptie","Consumer Defensive":"Basisconsumptie","Communication Services":"Communicatie",
    "Energy":"Energie","Industrials":"Industrie","Basic Materials":"Grondstoffen","Utilities":"Nutsbedrijven",
    "Real Estate":"Vastgoed","Overig":"Overig"
  };
  var MONTHS=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
  var nf1=new Intl.NumberFormat("nl-NL",{minimumFractionDigits:1,maximumFractionDigits:1});
  var nf2=new Intl.NumberFormat("nl-NL",{minimumFractionDigits:2,maximumFractionDigits:2});
  var $=function(id){return document.getElementById(id)};

  var period="fromHigh";
  try{var saved=localStorage.getItem("periode");if(saved&&PERIODS.some(function(p){return p.k===saved}))period=saved;}catch(e){}

  var mode="down";
  try{if(localStorage.getItem("modus")==="up")mode="up";}catch(e){}
  var rows=[],openTicker=null;

  function sec(s){return SECTORS[s]||s||"Overig"}
  // "Daling" als positief getal: voor fromHigh is de waarde al een daling.
  function drop(r,k){var v=r[k];if(v==null)return null;return k==="fromHigh"?v:-v}
  function fmtPct(v,k){
    if(v==null)return "–";
    if(k==="fromHigh")return v===0?"0,0%":"−"+nf1.format(v)+"%";
    return (v>0?"+":v<0?"−":"")+nf1.format(Math.abs(v))+"%";
  }
  function cls(d){if(d==null||Math.abs(d)<0.05)return "flat";if(d<0)return "up";return d>=20?"down2":"down"}
  function fmtCap(n){
    if(!n)return "–";
    if(n>=1e12)return "$"+nf2.format(n/1e12)+" bln";
    return "$"+nf1.format(n/1e9)+" mld";
  }
  function fmtDate(s){var p=s.split("-");return (+p[2])+" "+MONTHS[+p[1]-1]+" "+p[0]}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

  function renderPeriods(){
    $("periods").innerHTML=PERIODS.map(function(p){
      return '<button type="button" data-k="'+p.k+'" aria-pressed="'+(p.k===period)+'">'+p.l+'</button>';
    }).join("");
  }
  $("periods").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    period=b.dataset.k;
    try{localStorage.setItem("periode",period)}catch(err){}
    renderPeriods();render();
  });
  function renderMode(){
    Array.prototype.forEach.call($("mode").querySelectorAll("button"),function(b){b.setAttribute("aria-pressed",b.dataset.m===mode)});
  }
  $("mode").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    mode=b.dataset.m;
    try{localStorage.setItem("modus",mode)}catch(err){}
    renderMode();render();window.scrollTo({top:0,behavior:"smooth"});
  });
  $("sector").addEventListener("change",render);
  $("grp").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    if(b.classList.contains("x")){$("sector").value="";statFilter=null;render();$("heatwrap").scrollIntoView({behavior:"smooth",block:"center"});return}
    if(b.dataset.m){mode=b.dataset.m;try{localStorage.setItem("modus",mode)}catch(err){}renderMode();render();}
  });
  $("q").addEventListener("input",render);
  $("list").addEventListener("click",function(e){
    var b=e.target.closest(".row");if(!b)return;
    var li=b.parentNode,t=li.dataset.t;
    openTicker=openTicker===t?null:t;
    Array.prototype.forEach.call(document.querySelectorAll(".card.open"),function(c){if(c!==li){c.classList.remove("open");c.querySelector(".row").setAttribute("aria-expanded","false")}});
    li.classList.toggle("open",openTicker===t);
    b.setAttribute("aria-expanded",openTicker===t);
    if(openTicker===t)drawChart(li.querySelector(".chart"));
  });

  function periodLabel(k){for(var i=0;i<PERIODS.length;i++)if(PERIODS[i].k===k)return PERIODS[i].l;return k}

  var statFilter=null,topTicker=null;
  // Wat de kerncijfers tellen; dezelfde regels gebruikt het filter als je op een vakje tikt.
  function statDef(k){
    var pl=periodLabel(period).toLowerCase();
    if(mode==="down"){
      if(k==="s1")return {f:function(d){return d>0.05},l:period==="fromHigh"?"onder jaartop":"gedaald ("+pl+")",t:period==="fromHigh"?"Onder jaartop":"Gedaald · "+pl};
      return {f:function(d){return d>=20},l:"20%+ gezakt",t:"20%+ gezakt · "+pl};
    }
    if(period==="fromHigh"){
      if(k==="s1")return {f:function(d){return d<=5},l:"binnen 5% van jaartop",t:"Binnen 5% van jaartop"};
      return {f:function(d){return d<0.5},l:"op jaartop",t:"Op jaartop"};
    }
    if(k==="s1")return {f:function(d){return d<-0.05},l:"gestegen ("+pl+")",t:"Gestegen · "+pl};
    return {f:function(d){return d<=-20},l:"20%+ gestegen",t:"20%+ gestegen · "+pl};
  }
  function stats(){
    var vals=rows.map(function(r){return {r:r,d:drop(r,period)}}).filter(function(x){return x.d!=null});
    var sign=mode==="down"?1:-1;
    var top=vals.slice().sort(function(a,b){return (b.d-a.d)*sign})[0];
    var d1=statDef("s1"),d2=statDef("s2");
    $("sDown").textContent=vals.filter(function(x){return d1.f(x.d)}).length;
    $("sDownL").textContent="van "+vals.length+" "+d1.l;
    $("s20").textContent=vals.filter(function(x){return d2.f(x.d)}).length;$("s20L").textContent=d2.l;
    $("sTopT").textContent=mode==="down"?"grootste daler":(period==="fromHigh"?"dichtst bij top":"grootste stijger");
    $("sTop").textContent=top?fmtPct(top.r[period],period):"–";
    $("sTopL").textContent=top?top.r.name:"–";
    topTicker=top?top.r.ticker:null;
    Array.prototype.forEach.call(document.querySelectorAll(".stat[data-st^=s]"),function(b){b.setAttribute("aria-pressed",statFilter===b.dataset.st)});
  }
  function scrollToGrp(){var g=$("grp");g.style.scrollMarginTop=(document.querySelector(".bar").offsetHeight+8)+"px";g.scrollIntoView({behavior:"smooth",block:"start"});}
  document.querySelector(".stats").addEventListener("click",function(e){
    var b=e.target.closest(".stat");if(!b)return;
    var k=b.dataset.st;
    if(k==="top"){
      if(!topTicker)return;
      statFilter=null;$("sector").value="";$("q").value="";openTicker=topTicker;render();
      var c=document.querySelector('.card[data-t="'+topTicker+'"]');
      if(c){c.style.scrollMarginTop=(document.querySelector(".bar").offsetHeight+8)+"px";c.scrollIntoView({behavior:"smooth",block:"start"});}
      return;
    }
    statFilter=statFilter===k?null:k;render();
    if(statFilter)scrollToGrp();
  });

  function detail(r){
    var items=[
      ["Koers","$"+nf2.format(r.price)],["Beurswaarde",fmtCap(r.marketCap)],
      ["K/W",r.pe!=null?nf1.format(r.pe):"–"],["Rang in grootte","#"+r.rank],
      ["Vandaag",fmtPct(r.d1)],["Onder jaartop",fmtPct(r.fromHigh,"fromHigh")],
      ["1 maand",fmtPct(r.m1)],["3 maanden",fmtPct(r.m3)],
      ["Sinds 1 jan",fmtPct(r.ytd)],["1 jaar",fmtPct(r.y1)],
      ["5 jaar",fmtPct(r.y5)],["Jaartop","$"+(r.high52!=null?nf2.format(r.high52):"–")]
    ];
    var h='<div class="chart" data-t="'+esc(r.ticker)+'"><div class="chart-msg">Grafiek laden…</div></div><dl class="grid">'+items.map(function(i){return '<div><dt>'+i[0]+'</dt><dd>'+i[1]+'</dd></div>'}).join("")+'</dl>';
    var d=drop(r,period);
    if(r.y1!=null&&r.y1>50&&d!=null&&d>15)h+='<div class="warn">⚠️ Deze daling volgt op een grote stijging: het aandeel steeg het afgelopen jaar '+fmtPct(r.y1)+'.</div>';
    if(r.pe!=null&&r.pe>100)h+='<div class="warn">⚠️ Zeer hoge K/W ('+nf1.format(r.pe)+'): beleggers betalen veel voor de huidige winst.</div>';
    h+='<a class="ext" href="https://finance.yahoo.com/quote/'+encodeURIComponent(r.ticker)+'" target="_blank" rel="noopener">Bekijk op Yahoo Finance →</a>';
    return h;
  }

  // ---------- Grafiek ----------
  var RANGES=[{k:"1M",m:1},{k:"3M",m:3},{k:"1J",m:12},{k:"5J",m:60}];
  var range="1J";
  try{var sr=localStorage.getItem("bereik");if(sr&&RANGES.some(function(x){return x.k===sr}))range=sr;}catch(e){}
  var histP=null;
  function loadHist(){
    if(!histP)histP=getJSON("history.json");
    return histP;
  }
  var MON3=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
  function shortDate(s,withYear){var p=s.split("-");return (+p[2])+" "+MON3[+p[1]-1]+(withYear?" "+p[0]:"")}
  function pickSeries(h,t){
    var s=h.series[t];if(!s)return null;
    var useW=range==="5J",dates=useW?h.weeks:h.days,vals=useW?s.w:s.d;
    var m=0;for(var i=0;i<RANGES.length;i++)if(RANGES[i].k===range)m=RANGES[i].m;
    var end=dates[dates.length-1].split("-"),cut=new Date(+end[0],+end[1]-1-m,+end[2]);
    var cs=cut.getFullYear()+"-"+String(cut.getMonth()+1).padStart(2,"0")+"-"+String(cut.getDate()).padStart(2,"0");
    var out=[];
    for(var j=0;j<dates.length;j++){if(dates[j]>=cs&&vals[j]!=null)out.push({d:dates[j],v:vals[j]})}
    return out.length>1?out:null;
  }
  function drawChart(box){
    if(!box)return;
    var t=box.dataset.t,cur=box.dataset.cur==="EUR"?"€ ":"$";
    loadHist().then(function(h){
      var pts=pickSeries(h,t);
      var head='<div class="chart-top"><div class="chart-read"></div><div class="ranges" role="group" aria-label="Bereik grafiek">'+
        RANGES.map(function(x){return '<button type="button" data-r="'+x.k+'" aria-pressed="'+(x.k===range)+'">'+x.k+'</button>'}).join("")+'</div></div>';
      if(!pts){box.innerHTML=head+'<div class="chart-msg">Geen koersgeschiedenis beschikbaar.</div>';return}
      var W=Math.max(260,box.clientWidth||320),H=170,padL=4,padR=40,padT=14,padB=20;
      var lo=Infinity,hi=-Infinity,hiI=0,loI=0;
      pts.forEach(function(p,i){if(p.v<lo){lo=p.v;loI=i}if(p.v>hi){hi=p.v;hiI=i}});
      var span=(hi-lo)||hi*0.02||1,y0=lo-span*0.08,y1=hi+span*0.12;
      var X=function(i){return padL+i/(pts.length-1)*(W-padL-padR)};
      var Y=function(v){return padT+(1-(v-y0)/(y1-y0))*(H-padT-padB)};
      var first=pts[0].v,last=pts[pts.length-1].v,chg=(last/first-1)*100;
      var col=chg<-0.05?"var(--down)":chg>0.05?"var(--up)":"var(--muted)";
      var d=pts.map(function(p,i){return (i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1)}).join("");
      var area=d+"L"+X(pts.length-1).toFixed(1)+" "+(H-padB)+"L"+X(0).toFixed(1)+" "+(H-padB)+"Z";
      // 3 horizontale rasterlijnen met prijs rechts
      var g="";for(var k=0;k<3;k++){var v=lo+(hi-lo)*k/2,yy=Y(v);
        g+='<line class="grid-l" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+yy.toFixed(1)+'" y2="'+yy.toFixed(1)+'"/>'+
           '<text class="ax" x="'+(W-padR+6)+'" y="'+(yy+3).toFixed(1)+'">'+(v>=1000?Math.round(v).toLocaleString("nl-NL"):nf2.format(v).replace(/,00$/,""))+'</text>';}
      var lbl=[0,Math.floor((pts.length-1)/2),pts.length-1].map(function(i,n){
        var anchor=n===0?"start":n===2?"end":"middle";
        return '<text class="ax" text-anchor="'+anchor+'" x="'+X(i).toFixed(1)+'" y="'+(H-4)+'">'+shortDate(pts[i].d,range==="5J"||range==="1J")+'</text>'}).join("");
      var hx=X(hiI),hy=Y(hi),ha=hx>W*0.7?"end":hx<W*0.3?"start":"middle";
      var svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Koersgrafiek '+esc(t)+' ('+range+')">'+
        '<defs><linearGradient id="gf-'+esc(t)+'" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".18"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+
        g+'<path d="'+area+'" fill="url(#gf-'+esc(t)+')"/>'+
        '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
        '<circle class="hi" cx="'+hx.toFixed(1)+'" cy="'+hy.toFixed(1)+'" r="4" stroke="'+col+'"/>'+
        '<text class="hl" text-anchor="'+ha+'" x="'+hx.toFixed(1)+'" y="'+(hy-8).toFixed(1)+'">top '+nf2.format(hi)+'</text>'+
        lbl+'<line class="cross" y1="'+padT+'" y2="'+(H-padB)+'" style="display:none"/>'+
        '<circle class="dot" r="4" fill="'+col+'" stroke="var(--card)" stroke-width="2" style="display:none"/></svg>';
      box.innerHTML=head+'<div class="plot">'+svg+'</div>';
      var read=box.querySelector(".chart-read"),svgEl=box.querySelector("svg"),cross=box.querySelector(".cross"),dot=box.querySelector(".dot");
      function showDefault(){
        read.innerHTML='<b class="'+(chg<-0.05?"down":chg>0.05?"up":"flat")+'">'+fmtPct(chg)+'</b>'+range.replace("M"," maand").replace("J"," jaar")+' · van '+nf2.format(first)+' naar '+nf2.format(last);
        cross.style.display="none";dot.style.display="none";
      }
      function show(clientX){
        var rc=svgEl.getBoundingClientRect(),x=(clientX-rc.left)*W/rc.width;
        var i=Math.round((x-padL)/(W-padL-padR)*(pts.length-1));i=Math.max(0,Math.min(pts.length-1,i));
        var p=pts[i],cx=X(i),cy=Y(p.v),c=(p.v/first-1)*100;
        cross.setAttribute("x1",cx);cross.setAttribute("x2",cx);cross.style.display="";
        dot.setAttribute("cx",cx);dot.setAttribute("cy",cy);dot.style.display="";
        var fh=(1-p.v/hi)*100;
        read.innerHTML='<b>'+cur+nf2.format(p.v)+'</b>'+shortDate(p.d,true)+' · '+fmtPct(c)+' t.o.v. begin'+(fh>0.5?' · '+fmtPct(fh,"fromHigh")+' onder top':'');
      }
      showDefault();
      var plot=box.querySelector(".plot");
      plot.addEventListener("pointermove",function(e){show(e.clientX)});
      plot.addEventListener("pointerdown",function(e){show(e.clientX)});
      plot.addEventListener("pointerleave",showDefault);
      plot.addEventListener("touchmove",function(e){if(e.touches[0])show(e.touches[0].clientX)},{passive:true});
      plot.addEventListener("touchend",function(){setTimeout(showDefault,1200)});
    }).catch(function(){box.innerHTML='<div class="chart-msg">Grafiek kon niet worden geladen.</div>'});
  }
  document.addEventListener("click",function(e){
    var b=e.target.closest(".ranges button");if(!b)return;
    e.stopPropagation();
    range=b.dataset.r;try{localStorage.setItem("bereik",range)}catch(err){}
    drawChart(b.closest(".chart"));
  },true);

  // ---------- Extra koersen bovenaan ----------
  var extras=[],openExtra=null;
  function fmtEur(v){return v==null?"–":"€ "+(v>=10000?Math.round(v).toLocaleString("nl-NL"):nf2.format(v))}
  function chgCls(v){return v==null||Math.abs(v)<0.05?"flat":v<0?"down":"up"}
  function renderExtras(){
    var el=$("extras");
    if(!extras.length){el.hidden=true;return}
    el.hidden=false;
    el.innerHTML=extras.map(function(x){
      return '<button type="button" class="xt" data-x="'+esc(x.ticker)+'" aria-expanded="'+(openExtra===x.ticker)+'">'+
        '<span class="xl"><b>'+esc(x.label)+(x.live?'<span class="live" title="live"></span>':'')+'</b>'+esc(x.beurs)+'</span>'+
        '<span class="xp">'+fmtEur(x.price)+'</span>'+
        '<span class="xc '+chgCls(x.d1)+'">'+fmtPct(x.d1)+(x.ticker==="BTC-EUR"?' <span class="meta">24u</span>':' <span class="meta">dag</span>')+'</span></button>';
    }).join("");
    var x=null;for(var i=0;i<extras.length;i++)if(extras[i].ticker===openExtra)x=extras[i];
    if(!x){$("xpanel").innerHTML="";return}
    var items=[["1 maand",fmtPct(x.m1)],["3 maanden",fmtPct(x.m3)],["Sinds 1 jan",fmtPct(x.ytd)],["1 jaar",fmtPct(x.y1)],
      ["Onder jaartop",fmtPct(x.fromHigh,"fromHigh")],["Jaartop",fmtEur(x.high52)]];
    $("xpanel").innerHTML='<div class="xpanel"><h3>'+esc(x.name)+' <span class="meta">· '+esc(x.label)+' · '+esc(x.beurs)+'</span></h3>'+
      '<div class="chart" data-t="'+esc(x.ticker)+'" data-cur="EUR"><div class="chart-msg">Grafiek laden…</div></div>'+
      '<dl class="grid">'+items.map(function(i){return '<div><dt>'+i[0]+'</dt><dd>'+i[1]+'</dd></div>'}).join("")+'</dl></div>';
    drawChart($("xpanel").querySelector(".chart"));
  }
  $("extras").addEventListener("click",function(e){
    var b=e.target.closest(".xt");if(!b)return;
    openExtra=openExtra===b.dataset.x?null:b.dataset.x;renderExtras();
  });
  function liveBitcoin(){
    // Live prijs rechtstreeks van Bitvavo; lukt dat niet, dan blijft de prijs van de laatste update staan.
    fetch("https://api.bitvavo.com/v2/ticker/24h?market=BTC-EUR").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
      var x=null;for(var i=0;i<extras.length;i++)if(extras[i].ticker==="BTC-EUR")x=extras[i];
      var last=parseFloat(j.last),open=parseFloat(j.open);
      if(!x||!(last>0))return;
      x.price=last;if(open>0)x.d1=(last/open-1)*100;x.live=true;
      if(x.high52&&last>x.high52)x.high52=last;
      if(x.high52)x.fromHigh=Math.max(0,(1-last/x.high52)*100);
      renderExtras();
    }).catch(function(){});
  }

  // ---------- Sector-heatmap ----------
  function renderHeat(){
    var groups={};
    rows.forEach(function(r){
      var keys=[sec(r.sector)];if(r.ai)keys.push("AI");
      keys.forEach(function(k){(groups[k]=groups[k]||[]).push(r)});
    });
    var tiles=Object.keys(groups).map(function(k){
      var g=groups[k],w=0,sum=0,up=0,n=0;
      g.forEach(function(r){var v=r[period];if(v==null)return;w+=r.marketCap;sum+=v*r.marketCap;n++;if(period==="fromHigh"?v<5:v>0)up++});
      return {k:k,n:n,up:up,v:w?sum/w:null};
    }).filter(function(t){return t.v!=null});
    // score: positief = goed. Bij "Onder jaartop" geldt: minder dan 10% onder de top is goed.
    tiles.forEach(function(t){t.score=period==="fromHigh"?10-t.v:t.v});
    tiles.sort(function(a,b){return b.score-a.score});
    var maxA=Math.max.apply(null,tiles.map(function(t){return Math.abs(t.score)}).concat([5]));
    var cur=$("sector").value;
    $("heatwrap").hidden=!tiles.length;
    $("heat").innerHTML=tiles.map(function(t){
      var a=Math.min(1,Math.abs(t.score)/maxA),pctMix=Math.round(8+a*52);
      var bg=Math.abs(t.score)<0.3?"var(--card)":"color-mix(in oklab,"+(t.score>0?"var(--up)":"var(--down-strong)")+" "+pctMix+"%,var(--card))";
      var name=t.k==="AI"?"🤖 AI":t.k;
      var cnt=period==="fromHigh"?t.up+"/"+t.n+" bij top":t.up+"/"+t.n+" gestegen";
      return '<button type="button" class="ht'+(t.k==="AI"?' ai':'')+'" data-s="'+esc(t.k)+'" aria-pressed="'+(cur===t.k)+'" style="background:'+bg+'">'+
        '<span class="hn">'+esc(name)+'</span><span class="hv">'+fmtPct(t.v,period)+'</span><span class="hc">'+cnt+'</span></button>';
    }).join("");
  }
  $("heat").addEventListener("click",function(e){
    var b=e.target.closest(".ht");if(!b)return;
    var sel=$("sector");sel.value=sel.value===b.dataset.s?"":b.dataset.s;
    render();
    if(sel.value)scrollToGrp();
  });

  function render(){
    renderHeat();
    stats();
    var s=$("sector").value,q=$("q").value.trim().toLowerCase(),sf=statFilter?statDef(statFilter):null;
    var list=rows.filter(function(r){
      if(s==="AI"){if(!r.ai)return false}else if(s&&sec(r.sector)!==s)return false;
      if(sf){var dd=drop(r,period);if(dd==null||!sf.f(dd))return false}
      if(q&&r.name.toLowerCase().indexOf(q)<0&&r.ticker.toLowerCase().indexOf(q)<0)return false;
      return true;
    }).sort(function(a,b){
      var da=drop(a,period),db=drop(b,period);
      if(da==null)return 1;if(db==null)return -1;return mode==="down"?db-da:da-db;
    });
    var max=Math.max.apply(null,rows.map(function(r){return Math.abs(drop(r,period)||0)}).concat([1]));
    var best=mode==="down"?"slechtste eerst":"beste eerst";
    if(s||sf){
      $("grp").hidden=false;$("count").textContent="";
      var gname=[sf?sf.t:"",s?(s==="AI"?"🤖 AI":esc(s)):""].filter(Boolean).join(" · ");
      $("grp").innerHTML='<div class="gt">'+gname+'<span>'+list.length+' · '+best+'</span></div>'+
        '<div class="seg"><button type="button" data-m="down" aria-pressed="'+(mode==="down")+'">📉</button><button type="button" data-m="up" aria-pressed="'+(mode==="up")+'">📈</button></div>'+
        '<button type="button" class="x" aria-label="Filter wissen">✕</button>';
    }else{
      $("grp").hidden=true;
      $("count").textContent=list.length+" aandelen · "+periodLabel(period).toLowerCase()+" · "+best;
    }
    if(!list.length){$("list").innerHTML='<li class="empty">Geen aandelen gevonden.</li>';return}
    $("list").innerHTML=list.map(function(r,i){
      var d=drop(r,period),c=cls(d),w=d==null?0:Math.min(100,Math.abs(d)/max*100);
      var col=c==="up"?"var(--up)":c==="down2"?"var(--down-strong)":c==="down"?"var(--down)":"var(--muted)";
      var open=openTicker===r.ticker;
      return '<li class="card'+(open?' open':'')+'" data-t="'+esc(r.ticker)+'">'+
        '<button type="button" class="row" aria-expanded="'+open+'">'+
          '<span class="pos">'+(i+1)+'</span>'+
          '<span class="main"><span class="name" style="display:block">'+esc(r.name)+'</span>'+
          '<span class="meta" style="display:block"><span class="tk">'+esc(r.ticker)+'</span>'+(r.ai?' <span class="aitag">AI</span>':'')+' · '+esc(sec(r.sector))+' · #'+r.rank+'</span></span>'+
          '<span class="val"><span class="pct '+c+'" style="display:block">'+fmtPct(r[period],period)+'</span>'+
          '<span class="track" style="display:block"><span class="fill" style="display:block;width:'+w.toFixed(1)+'%;background:'+col+'"></span></span></span>'+
        '</button><div class="detail">'+detail(r)+'</div></li>';
    }).join("");
    if(openTicker){var oc=document.querySelector('.card.open .chart');if(oc)drawChart(oc);}
  }

  renderPeriods();renderMode();
  var sectorsDone=false;
  // Gegevens rechtstreeks uit de repo halen: nieuwe updates zijn dan meteen zichtbaar,
  // ook als GitHub Pages nog bezig is met klaarzetten. Lukt dat niet, dan de kopie op de site zelf.
  var RAW="https://raw.githubusercontent.com/wgnghr44bg-coder/aandelen/main/docs/";
  function getJSON(name){
    var t="?t="+Date.now();
    function get(u){return fetch(u+t,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
    return Promise.all([get(RAW+name).catch(function(){return null}),get(name).catch(function(){return null})]).then(function(a){
      var x=a[0],y=a[1];
      if(!x&&!y)throw new Error("laden mislukt");
      if(!x||!y)return x||y;
      return (x.updated||"")>=(y.updated||"")?x:y; // de nieuwste van de twee
    });
  }
  function load(manual){
    var btn=$("refresh");btn.classList.add("busy");btn.disabled=true;
    return getJSON("data.json").then(function(data){
      rows=data.rows||[];
      var oldBtc=null;extras.forEach(function(x){if(x.ticker==="BTC-EUR"&&x.live)oldBtc=x});
      extras=data.extras||[];renderExtras();liveBitcoin();
      if(!rows.length||!data.asof){$("upd").textContent="Nog geen gegevens.";$("list").innerHTML="";return}
      if(!sectorsDone){
        sectorsDone=true;
        var secs={};rows.forEach(function(r){secs[sec(r.sector)]=1});
        if(rows.some(function(r){return r.ai})){var ao=document.createElement("option");ao.value="AI";ao.textContent="🤖 AI";$("sector").appendChild(ao);}
        Object.keys(secs).sort(function(a,b){return a.localeCompare(b,"nl")}).forEach(function(n){
          var o=document.createElement("option");o.value=n;o.textContent=n;$("sector").appendChild(o);
        });
      }
      var u=new Date(data.updated);
      $("upd").innerHTML="🔄 <b>"+u.toLocaleString("nl-NL",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+"</b> · slot "+shortDate(data.asof,false);
      $("foot").textContent="Geen financieel advies · Yahoo Finance, Bitvavo";
      if(manual)histP=null;
      render();
    }).catch(function(){
      $("upd").textContent="Laden mislukt. Probeer later opnieuw.";
    }).then(function(){btn.classList.remove("busy");btn.disabled=false;});
  }
  $("refresh").addEventListener("click",function(){load(true)});
  load(false);
})();
</script>
</body>
